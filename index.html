<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://vxrxmpyjewlfqpyrwzas.supabase.co wss://vxrxmpyjewlfqpyrwzas.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'; manifest-src 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C5CF5">
<title>HomeFlow</title>
<meta name="description" content="A friendly household money notebook: expenses, bills, monthly plan, lists and goals.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --page:#E8EBF3;--bg:#F6F7FB;--surface:#FFFFFF;--surface-2:#F1F2F8;--ink:#191B3A;--ink-2:#4A4E6D;--ink-3:#8A8EA8;
  --line:#E5E7F0;--rule:#EEF0F6;
  --accent:#6C5CF5;--accent-2:#5A49E8;--accent-ink:#FFFFFF;--accent-soft:#EDEBFE;
  --cta:#16183A;--cta-ink:#FFFFFF;
  --gold:#B7791F;--gold-bg:#FFF4DF;--gold-ink:#7A4E0B;
  --rose:#D9485F;--rose-soft:#FDE8EC;--good:#1F9D67;--good-soft:#DDF6EA;
  --hero-bg:linear-gradient(145deg,#8274FA 0%,#6352EE 100%);--hero-ink:#FFFFFF;--hero-sub:#DCD7FF;--hero-track:rgba(255,255,255,.22);--hero-fill:#FFFFFF;
  --c-home:#6C5CF5;--c-food:#22A06B;--c-bills:#E5A03A;--c-family:#E0679A;--c-transport:#2E9CC6;
  --c-health:#E04E68;--c-shopping:#F08A4B;--c-fun:#A45FD8;--c-other:#8A8EA8;
  --shadow:0 1px 2px rgba(25,27,58,.04),0 10px 30px -14px rgba(25,27,58,.14);
  --r-lg:24px;--r-md:18px;--r-sm:12px;
  --display:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --page:#090A13;--bg:#10111E;--surface:#191B2E;--surface-2:#23263E;--ink:#ECEDF8;--ink-2:#B4B7D0;--ink-3:#7F83A0;
  --line:#2A2D47;--rule:#23263E;
  --accent:#9A8EFF;--accent-2:#B0A6FF;--accent-ink:#130F33;--accent-soft:#2A2656;
  --cta:#9A8EFF;--cta-ink:#130F33;
  --gold:#F2B85B;--gold-bg:#34290F;--gold-ink:#F8DDA7;
  --rose:#FF8198;--rose-soft:#3E1C26;--good:#5CD49A;--good-soft:#173A2A;
  --hero-bg:linear-gradient(145deg,#5A4BD6 0%,#4234B8 100%);--hero-ink:#FFFFFF;--hero-sub:#CFC9FF;--hero-track:rgba(255,255,255,.18);--hero-fill:#FFFFFF;
  --c-home:#9A8EFF;--c-food:#5CD49A;--c-bills:#F2B85B;--c-family:#F08DB6;--c-transport:#5FC0E6;
  --c-health:#FF8198;--c-shopping:#FFA877;--c-fun:#C48FF0;--c-other:#9A9EB8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#090A13;--bg:#10111E;--surface:#191B2E;--surface-2:#23263E;--ink:#ECEDF8;--ink-2:#B4B7D0;--ink-3:#7F83A0;
  --line:#2A2D47;--rule:#23263E;
  --accent:#9A8EFF;--accent-2:#B0A6FF;--accent-ink:#130F33;--accent-soft:#2A2656;
  --cta:#9A8EFF;--cta-ink:#130F33;
  --gold:#F2B85B;--gold-bg:#34290F;--gold-ink:#F8DDA7;
  --rose:#FF8198;--rose-soft:#3E1C26;--good:#5CD49A;--good-soft:#173A2A;
  --hero-bg:linear-gradient(145deg,#5A4BD6 0%,#4234B8 100%);--hero-ink:#FFFFFF;--hero-sub:#CFC9FF;--hero-track:rgba(255,255,255,.18);--hero-fill:#FFFFFF;
  --c-home:#9A8EFF;--c-food:#5CD49A;--c-bills:#F2B85B;--c-family:#F08DB6;--c-transport:#5FC0E6;
  --c-health:#FF8198;--c-shopping:#FFA877;--c-fun:#C48FF0;--c-other:#9A9EB8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}

/* shell */
html,body{background:var(--page)}
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh;background:var(--bg)}
.main,.grid>*,.card{min-width:0}
.side{display:none}
.main{padding-inline:16px;padding-block:18px 130px;max-width:1180px;width:100%;margin-inline:auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.topbar .tl{display:flex;align-items:center;gap:12px;min-width:0}
.topbar .tr{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.01em}
.mark{width:38px;height:38px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.greet{color:var(--ink-3);font-size:13.5px}
.iconbtn{width:42px;height:42px;border-radius:13px;border:0;background:var(--surface);display:grid;place-items:center;color:var(--ink-2);box-shadow:var(--shadow);position:relative}
.iconbtn:hover{color:var(--accent)}
.iconbtn .badge{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--rose);border:2px solid var(--surface)}
.themepill{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.themepill button{border:0;background:none;display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-3)}
.themepill button svg{width:15px;height:15px}
.themepill button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ctabtn{border:0;background:var(--cta);color:var(--cta-ink);border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.ctabtn:hover{opacity:.9}
.hide-sm{display:none}
.show-sm{display:grid}
@media (min-width:700px){.show-sm{display:none}}
@media (min-width:700px){.hide-sm{display:inline-flex}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:12px;color:var(--ink-3);font-size:11.5px;font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{stroke-width:2.3}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:21;width:60px;height:60px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 14px 28px -10px color-mix(in srgb,var(--accent) 80%,transparent);display:grid;place-items:center;transition:transform .15s}
.fab:hover{transform:translateY(-2px)}
.fab:active{transform:scale(.96)}
.fab svg{width:28px;height:28px}
@media (min-width:960px){
  .app{grid-template-columns:96px minmax(0,1fr);margin:18px;border-radius:32px;min-height:calc(100vh - 36px);box-shadow:0 30px 60px -40px rgba(25,27,58,.35);overflow:clip}
  .side{display:flex;flex-direction:column;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - 36px);padding:26px 0;background:transparent;isolation:isolate}
  .side::before{content:"";position:absolute;left:0;top:26%;height:52%;width:52px;background:var(--accent);border-radius:0 44px 44px 0;z-index:-1}
  .side .brand{padding-bottom:22px}
  .side .brand span:last-child{display:none}
  .nav{width:50px;height:50px;border-radius:15px;border:0;background:var(--surface);display:grid;place-items:center;color:var(--ink-3);box-shadow:var(--shadow);position:relative;transition:color .15s,transform .15s}
  .nav svg{width:21px;height:21px}
  .nav:hover{color:var(--accent);transform:translateX(2px)}
  .nav[aria-current="page"]{color:var(--accent-ink);background:var(--accent);box-shadow:0 10px 20px -8px color-mix(in srgb,var(--accent) 90%,transparent)}
  .side .nav[aria-current="page"]{background:var(--surface);color:var(--accent);outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent)}
  .nav .lbl{position:absolute;left:62px;top:50%;transform:translateY(-50%);background:var(--cta);color:var(--cta-ink);font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:5}
  .nav:hover .lbl,.nav:focus-visible .lbl{opacity:1}
  .side .spacer{flex:1}
  .tabbar{display:none}
  .topbar .tl .brand{display:none}
  .main{padding-inline:32px;padding-block:28px 60px}
  .fab{bottom:36px;right:36px}
}

/* sign-in gate */
.app.gated{grid-template-columns:minmax(0,1fr)}
.gate{display:grid;gap:28px;align-items:center;min-height:calc(100vh - 80px);padding-block:12px 40px;grid-template-columns:minmax(0,1fr)}
@media (min-width:880px){.gate{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px}}
.gate-hero h1{font-size:clamp(32px,5vw,52px);font-weight:700;line-height:1.08;letter-spacing:-.02em;margin-top:26px}
.gate-hero h1 span{color:var(--accent)}
.gate-hero p{color:var(--ink-2);font-size:17px;max-width:46ch;margin:16px 0 22px}
.gate-tiles{display:flex;flex-wrap:wrap;gap:8px}
.gate-tiles span{background:var(--surface);box-shadow:var(--shadow);padding:9px 14px;border-radius:14px;font-weight:600;font-size:14px}
.gate-card{padding:28px}
.gate-card h2{font-size:26px;font-weight:700}
.gate-card>p{margin:6px 0 18px}
.gate-card form{display:flex;flex-direction:column;gap:14px}
.gate-card form.addline{flex-direction:row}
.or{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--ink-3);font-size:13px;font-weight:600}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.gate-err{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:var(--rose-soft);color:var(--rose);font-size:14px}
.joincode{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.18em;padding:8px 16px;border-radius:14px;background:var(--accent-soft);color:var(--accent);user-select:all}

/* greeting row */
.hello{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);margin-bottom:20px;align-items:center}
@media (min-width:900px){.hello{grid-template-columns:minmax(0,1.05fr) minmax(0,1.4fr)}}
.hello h1{font-size:clamp(28px,4.4vw,42px);font-weight:700;line-height:1.1;letter-spacing:-.02em}
.hello h1 .wave{display:inline-flex;gap:4px;vertical-align:middle;margin-left:8px}
.hello h1 .wave span{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:16px;border:2px solid var(--bg)}
.hello h1 .wave span+span{margin-left:-12px}
.hello p{margin:10px 0 0;color:var(--ink-2);max-width:44ch}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:559px){.tile{padding:10px;border-radius:18px}.tile .art{height:56px;font-size:30px}.tile small{display:none}.tile b{font-size:13px}}
@media (min-width:560px){.tiles{grid-template-columns:.7fr repeat(3,minmax(0,1fr))}}
.tile{border:0;background:var(--surface);border-radius:22px;padding:14px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile .art{height:74px;border-radius:15px;display:grid;place-items:center;font-size:38px;background:var(--surface-2);position:relative;overflow:hidden}
.tile .art::after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--ink-3) 35%,transparent);right:-20px;bottom:-30px}
.tile b{font-size:14.5px}
.tile small{color:var(--ink-3);font-size:12px;line-height:1.35}
.tile.dashed{align-items:center;justify-content:center;background:color-mix(in srgb,var(--surface) 60%,transparent);border:2px dashed var(--line);box-shadow:none;min-height:130px}
.tile.dashed .plus{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:22px;font-weight:600}
@media (max-width:559px){.tile.dashed{display:none}}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:12px}
.week button{border:0;background:none;padding:6px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-3);font-weight:600}
.week button b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--ink)}
.week button.on b{background:var(--accent);color:var(--accent-ink)}
.week button i{width:5px;height:5px;border-radius:50%;background:var(--gold)}
.slot{display:flex;align-items:center;gap:10px;margin:10px 0 6px;color:var(--ink-3);font-size:12.5px;font-weight:700}
.slot::after{content:"";flex:1;border-top:1.5px dashed var(--line)}
.event{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface-2);margin-bottom:8px}
.event .ev-i{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:16px;flex:none}
.event .t{flex:1;min-width:0}
.event .t b{display:block;font-size:14px}
.event .t small{font-size:12px;color:var(--ink-3)}
.pring{--p:0;--rc:var(--accent);width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.pring span{width:46px;height:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13.5px}
.minirow{display:flex;align-items:center;gap:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* layout */
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid.hero{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}.span2{grid-column:1/-1}}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:0;border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{font-size:18px;font-weight:700}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.link{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:4px 2px}
.muted{color:var(--ink-3)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:clamp(26px,5vw,34px);font-weight:800}
.page-h p{margin:4px 0 0;color:var(--ink-3);max-width:60ch}

/* hero */
.hero-card{background:var(--hero-bg);box-shadow:0 20px 40px -24px rgba(90,73,232,.7);color:var(--hero-ink);border-radius:var(--r-lg);padding:22px;position:relative;overflow:hidden}
.hero-card::after{content:"";position:absolute;right:-50px;top:-70px;width:230px;height:230px;border-radius:50%;border:30px solid rgba(255,255,255,.09)}.hero-card::before{content:"";position:absolute;right:60px;bottom:-40px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero-card .eyebrow{color:var(--hero-sub)}
.big{font-family:var(--display);font-weight:700;font-size:clamp(38px,9vw,54px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero-sub{color:var(--hero-sub);font-size:14px;margin-top:4px}
.bar{height:12px;border-radius:99px;background:var(--hero-track);overflow:hidden;margin:20px 0 14px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--hero-fill);box-shadow:0 0 12px rgba(255,255,255,.5);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.splits{display:flex;gap:18px 26px;flex-wrap:wrap;position:relative;z-index:1}
.splits b{display:block;font-family:var(--display);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.splits span{font-size:13px;color:var(--hero-sub)}
.left-card{background:var(--surface);color:var(--ink);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;box-shadow:var(--shadow)}
.left-card .eyebrow{color:var(--ink-3)}
.left-card .big{color:var(--ink)}
.perday{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:var(--good-soft);color:var(--ink-2)}
.perday b{font-family:var(--display);font-size:24px;font-weight:700;color:var(--good);font-variant-numeric:tabular-nums;display:block}
.left-card.neg{background:var(--rose-soft);color:var(--rose)}
.left-card .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.left-card.neg .big,.left-card.neg .eyebrow{color:var(--rose)}

/* capture */
.capture{display:flex;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:8px 8px 8px 16px;transition:border-color .15s}
.capture:focus-within{border-color:var(--accent)}
.capture input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;padding:8px 0}
.capture .spark{color:var(--accent);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink-2)}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.hint{font-size:13px;color:var(--ink-3);margin-top:8px}

/* notebook list */
.notebook{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,var(--rule) 47px,var(--rule) 48px)}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:4px 0}
.row .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none;background:color-mix(in srgb,var(--cc,var(--c-other)) 16%,transparent)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--ink-3);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .x{opacity:.0;border:0;background:none;color:var(--ink-3);width:32px;height:32px;border-radius:9px;flex:none}
.row:hover .x,.row .x:focus-visible{opacity:1}
@media (hover:none){.row .x{opacity:.6}}
.row .x:hover{background:var(--surface-2);color:var(--rose)}
.rowbtn{display:flex;width:100%;border:0;background:none;text-align:left;padding:0;border-radius:10px}
.rowbtn:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.empty{padding:18px 4px;color:var(--ink-3);font-size:14.5px}
.total-line{display:flex;justify-content:space-between;border-top:1px dashed var(--line);margin-top:8px;padding-top:12px;font-weight:700}

/* category bars */
.cats{display:flex;flex-direction:column;gap:12px}
.cat{display:grid;grid-template-columns:36px 1fr auto;gap:4px 12px;align-items:center}
.cat .ic{grid-row:span 2}
.cat .nm{font-weight:600;font-size:14.5px}
.cat .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:14.5px;text-align:right}
.cat .track{grid-column:2/4;height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden;position:relative}
.cat .track i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--cc)}
.cat .track i.over{background:repeating-linear-gradient(135deg,var(--cc) 0 6px,color-mix(in srgb,var(--cc) 60%,var(--surface)) 6px 12px)}
.cat small{color:var(--ink-3);font-weight:500;font-size:12.5px}

/* bills */
.bill{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.bill:last-child{border-bottom:0}
.due{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.due.soon{background:var(--gold-bg);color:var(--gold)}
.due.soon,.due.late,.due.later,.due.paid{font-size:12px}
.due.late{background:var(--rose-soft);color:var(--rose)}
.due.later{background:var(--surface-2);color:var(--ink-2)}
.due.paid{background:var(--good-soft);color:var(--good)}
.paybtn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--ink-2);white-space:nowrap}
.paybtn:hover{border-color:var(--accent);color:var(--accent)}
.paybtn.on{background:var(--good);border-color:var(--good);color:#fff}

/* reminders */
.reminders{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.remind{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:var(--gold-bg);color:var(--gold-ink);font-size:14.5px}
.remind.late{background:var(--rose-soft);color:var(--rose)}
.remind b{font-weight:700}
.remind .sp{flex:1}
.sample{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;border:1.5px dashed var(--line);margin-bottom:16px;font-size:14px;color:var(--ink-2)}
.sample .sp{flex:1;min-width:200px}

/* insights */
.insight{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.insight:last-child{border-bottom:0}
.insight .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:8px;flex:none}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink);transition:transform .1s,background .15s}
.btn:hover{background:var(--accent-2)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.ghost:hover{background:color-mix(in srgb,var(--accent) 20%,var(--surface))}
.btn.danger{background:var(--rose-soft);color:var(--rose)}
.btn.block{width:100%;padding:16px;font-size:16.5px;letter-spacing:.02em}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:11px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:13px;font-weight:700;color:var(--ink-2)}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:13px;padding:12px 14px;font-size:16px;outline:none}
.inp:focus{border-color:var(--accent)}
.amount-inp{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--line);padding:4px 2px}
.amount-inp:focus-within{border-color:var(--accent)}
.amount-inp span{font-family:var(--display);font-size:38px;font-weight:700;color:var(--ink-3)}
.amount-inp input{border:0;outline:none;background:none;font-family:var(--display);font-size:42px;font-weight:800;width:100%;min-width:0;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.catpick{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:600;color:var(--ink-2);transition:border-color .12s,background .12s}
.catpick .e{font-size:22px;line-height:1.2}
.catpick[aria-pressed="true"]{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--surface));color:var(--ink)}
.subs{display:flex;flex-wrap:wrap;gap:6px}
.subpick{border:1px solid var(--line);background:none;border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--ink-2)}
.subpick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.42);z-index:40;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:24px;font-weight:800;margin-bottom:16px}
.sheet form{display:flex;flex-direction:column;gap:16px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media (min-width:700px){.sheet{left:50%;right:auto;bottom:50%;width:min(560px,calc(100vw - 32px));border-radius:24px;transform:translate(-50%,56%) scale(.98);opacity:0;padding:22px 26px 26px;transition:transform .22s,opacity .22s}.sheet.show{transform:translate(-50%,50%);opacity:1}.sheet .grab{display:none}}

/* filters */
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.filters .rowf{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters .inp.small{width:auto;padding:9px 12px;font-size:14.5px;border-radius:11px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{padding-left:42px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 2px;padding-bottom:6px;border-bottom:1.5px solid var(--line)}
.dayhead:first-child{margin-top:0}
.dayhead b{font-family:var(--display);font-size:16px}
.dayhead span{font-size:13.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* month */
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:14px;border-radius:16px;background:var(--surface-2)}
.stat span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.stat b{display:block;font-family:var(--display);font-size:clamp(17px,4vw,24px);font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.monthnav{display:flex;align-items:center;gap:8px}
.cols{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:20px;position:relative;border-bottom:1.5px solid var(--line)}
.colw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.colw i{display:block;width:min(38px,70%);background:var(--accent);border-radius:8px 8px 3px 3px;opacity:.85}
.colw.cur i{opacity:1;background:var(--accent)}
.colw:not(.cur) i{background:color-mix(in srgb,var(--accent) 45%,var(--surface-2))}
.colw em{position:absolute;font-style:normal;font-size:11.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.colx{display:flex;gap:10px;margin-top:6px}
.colx span{flex:1;text-align:center;font-size:12px;color:var(--ink-3);font-weight:600}
.incline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--gold)}
.incline span{position:absolute;right:0;top:-18px;font-size:11px;font-weight:700;color:var(--gold)}
.plan-row{display:grid;grid-template-columns:36px 1fr 110px;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.plan-row:last-child{border-bottom:0}
.plan-row .ic{grid-row:span 2}
.plan-row .nm{font-weight:600}
.plan-row .meta{grid-column:2/3;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.plan-row .meta b.over{color:var(--rose)}
.plan-row .meta b.ok{color:var(--good)}
.plan-row input{grid-row:1/3;grid-column:3;padding:9px 10px;font-size:15px;text-align:right;border-radius:11px}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:190px}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--cc);flex:none}
.legend span{flex:1}
.legend b{font-variant-numeric:tabular-nums}

/* lists */
.check{display:flex;align-items:center;gap:12px;min-height:48px;padding:4px 0}
.check input[type=checkbox]{appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--ink-3);display:grid;place-items:center;flex:none;background:var(--surface);transition:background .12s}
.check input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.check input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check .t{flex:1;min-width:0}
.check .t.done{text-decoration:line-through;color:var(--ink-3)}
.check small{display:block;font-size:12.5px;color:var(--ink-3)}
.check small.late{color:var(--rose);font-weight:600}
.addline{display:flex;gap:8px;margin-top:10px}

.addline .date{width:150px;flex:none}

/* goals */
.goals{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.goal .top{display:flex;gap:12px;align-items:center}
.goal .e{font-size:26px;width:48px;height:48px;border-radius:15px;background:var(--surface-2);display:grid;place-items:center}
.goal h3{font-size:17px}
.ring{--p:0;width:72px;height:72px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none;margin-left:auto}
.ring span{width:56px;height:56px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px}
.goal .nums{display:flex;justify-content:space-between;margin:14px 0 12px;font-size:14px}
.goal .nums b{display:block;font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}

/* calendar */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .wd{font-size:11.5px;font-weight:700;color:var(--ink-3);text-align:center;padding:4px 0;letter-spacing:.05em;text-transform:uppercase}
.day{aspect-ratio:1/1;max-width:100%;border:1px solid transparent;background:var(--surface-2);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px;font-weight:600;font-size:14px;min-width:0}
.day.out{opacity:.35}
.day.today{border-color:var(--accent);color:var(--accent)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.dots .b{background:var(--gold)}.dots .e{background:var(--accent)}.dots .k{background:var(--c-family)}
.day[aria-pressed="true"] .dots .e{background:var(--accent-soft)}
.calkey{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-3);margin-top:12px}
.calkey i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* family */
.members{display:flex;flex-wrap:wrap;gap:10px}
.member{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:99px;background:var(--surface-2);font-weight:600}
.member .av{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:18px}
.member button{border:0;background:none;color:var(--ink-3);padding:2px 4px}
.whopick{display:flex;gap:6px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14.5px;z-index:60;opacity:0;transition:.22s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.loading{display:grid;place-items:center;min-height:60vh;color:var(--ink-3);gap:10px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
